<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Miss Me? · by Klinical</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Aesthetic animated background -->
  <div class="bg-gradient"></div>
  <div class="bg-blobs">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <!-- Floating hearts background -->
  <div id="heartField" class="heart-field"></div>

  <!-- Main card -->
  <main class="glass card" id="card">
    <h1 class="question">Do you miss me? 🥺</h1>
    <p class="sub">Be honest…</p>

    <div class="buttons" id="buttons">
      <button id="yesBtn" class="btn yes">Yes 💖</button>
      <button id="noBtn" class="btn no">No</button>
    </div>
  </main>

  <!-- Success overlay -->
  <div class="overlay" id="overlay">
    <div class="overlay-content">
      <h2 class="reveal-text">I miss you too 💕</h2>
      <p class="reveal-sub">…more than words can say.</p>
      <button class="btn again" id="againBtn">Ask me again 🔁</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="credit">
    Crafted with 💗 by <strong>Klinical</strong>
  </footer>

  <script src="script.js"></script>
</body>
</html>
